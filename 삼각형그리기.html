<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼각형 작도 웹 앱</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .inputs {
            display: none;
        }
        .active {
            display: block;
        }
        #canvas-container {
            margin-top: 20px;
            text-align: center;
        }
        canvas {
            border: 1px solid #ddd;
            background-color: #fff;
            border-radius: 4px;
        }
        .error-message {
            color: #d9534f;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>삼각형 작도기</h1>
    
    <div class="form-group">
        <label for="condition">작도 조건 선택:</label>
        <select id="condition" onchange="changeCondition()">
            <option value="SSS">SSS (세 변의 길이)</option>
            <option value="SAS">SAS (두 변의 길이크기와 그 사이 끼인각)</option>
            <option value="ASA">ASA (한 변의 길이크기와 양 끝각)</option>
        </select>
    </div>

    <!-- SSS 입력창 -->
    <div id="SSS-inputs" class="inputs active">
        <div class="form-group">
            <label>변 a 길이:</label>
            <input type="number" id="sss-a" value="100" min="1">
        </div>
        <div class="form-group">
            <label>변 b 길이:</label>
            <input type="number" id="sss-b" value="120" min="1">
        </div>
        <div class="form-group">
            <label>변 c 길이:</label>
            <input type="number" id="sss-c" value="150" min="1">
        </div>
    </div>

    <!-- SAS 입력창 -->
    <div id="SAS-inputs" class="inputs">
        <div class="form-group">
            <label>변 b 길이:</label>
            <input type="number" id="sas-b" value="120" min="1">
        </div>
        <div class="form-group">
            <label>끼인각 A (°):</label>
            <input type="number" id="sas-angle" value="60" min="1" max="179">
        </div>
        <div class="form-group">
            <label>변 c 길이:</label>
            <input type="number" id="sas-c" value="150" min="1">
        </div>
    </div>

    <!-- ASA 입력창 -->
    <div id="ASA-inputs" class="inputs">
        <div class="form-group">
            <label>각 B (°):</label>
            <input type="number" id="asa-angleB" value="45" min="1" max="178">
        </div>
        <div class="form-group">
            <label>변 c 길이:</label>
            <input type="number" id="asa-c" value="200" min="1">
        </div>
        <div class="form-group">
            <label>각 A (°):</label>
            <input type="number" id="asa-angleA" value="60" min="1" max="178">
        </div>
    </div>

    <button onclick="drawTriangle()">삼각형 그리기</button>
    <div id="error" class="error-message"></div>
</div>

<div id="canvas-container">
    <canvas id="triangleCanvas" width="500" height="400"></canvas>
</div>

<script>
    function changeCondition() {
        const condition = document.getElementById('condition').value;
        document.querySelectorAll('.inputs').forEach(el => el.classList.remove('active'));
        document.getElementById(`${condition}-inputs`).classList.add('active');
        document.getElementById('error').innerText = '';
    }

    function drawTriangle() {
        const canvas = document.getElementById('triangleCanvas');
        const ctx = canvas.getContext('2d');
        const errorDiv = document.getElementById('error');
        errorDiv.innerText = '';
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const condition = document.getElementById('condition').value;
        let p1 = { x: 0, y: 0 }; // Vertex A (or starting point)
        let p2 = { x: 0, y: 0 }; // Vertex B
        let p3 = { x: 0, y: 0 }; // Vertex C

        const toRad = deg => (deg * Math.PI) / 180;

        if (condition === 'SSS') {
            const a = parseFloat(document.getElementById('sss-a').value);
            const b = parseFloat(document.getElementById('sss-b').value);
            const c = parseFloat(document.getElementById('sss-c').value);

            // 삼각형 성립 조건 확인 (가장 긴 변 < 나머지 두 변의 합)
            if (a + b <= c || a + c <= b || b + c <= a) {
                errorDiv.innerText = '오류: 가장 긴 변의 길이는 나머지 두 변의 길이의 합보다 작아야 합니다.';
                return;
            }

            // 코사인 법칙으로 각 A 계산
            const cosA = (b * b + c * c - a * a) / (2 * b * c);
            const angleA = Math.acos(cosA);

            p1 = { x: 0, y: 0 };
            p2 = { x: c, y: 0 };
            p3 = { x: b * Math.cos(angleA), y: -b * Math.sin(angleA) };

        } else if (condition === 'SAS') {
            const b = parseFloat(document.getElementById('sas-b').value);
            const angleADeg = parseFloat(document.getElementById('sas-angle').value);
            const c = parseFloat(document.getElementById('sas-c').value);

            if (angleADeg >= 180 || angleADeg <= 0) {
                errorDiv.innerText = '오류: 각도는 0도 초과 180도 미만이어야 합니다.';
                return;
            }

            const angleA = toRad(angleADeg);
            p1 = { x: 0, y: 0 };
            p2 = { x: c, y: 0 };
            p3 = { x: b * Math.cos(angleA), y: -b * Math.sin(angleA) };

        } else if (condition === 'ASA') {
            const angleBDeg = parseFloat(document.getElementById('asa-angleB').value);
            const c = parseFloat(document.getElementById('asa-c').value);
            const angleADeg = parseFloat(document.getElementById('asa-angleA').value);

            if (angleADeg + angleBDeg >= 180) {
                errorDiv.innerText = '오류: 두 각의 합은 180도 미만이어야 합니다.';
                return;
            }

            const angleA = toRad(angleADeg);
            const angleB = toRad(angleBDeg);
            const angleC = Math.PI - angleA - angleB;

            // 사인 법칙으로 변 b의 길이 계산
            const b = (c * Math.sin(angleB)) / Math.sin(angleC);

            p1 = { x: 0, y: 0 };
            p2 = { x: c, y: 0 };
            p3 = { x: b * Math.cos(angleA), y: -b * Math.sin(angleA) };
        }

        // 캔버스 중앙 정렬 및 스케일 조정 (화면에 꽉 차게 보기 좋게 조정)
        const points = [p1, p2, p3];
        const minX = Math.min(...points.map(p => p.x));
        const maxX = Math.max(...points.map(p => p.x));
        const minY = Math.min(...points.map(p => p.y));
        const maxY = Math.max(...points.map(p => p.y));

        const triWidth = maxX - minX;
        const triHeight = maxY - minY;

        const padding = 50;
        const scaleX = (canvas.width - padding * 2) / triWidth;
        const scaleY = (canvas.height - padding * 2) / triHeight;
        const scale = Math.min(scaleX, scaleY);

        // 정점 위치 재조정 (캔버스 내부로 이동)
        const offsetX = (canvas.width - triWidth * scale) / 2 - minX * scale;
        const offsetY = (canvas.height - triHeight * scale) / 2 - minY * scale;

        const transform = p => ({
            x: p.x * scale + offsetX,
            y: p.y * scale + offsetY
        });

        const tp1 = transform(p1);
        const tp2 = transform(p2);
        const tp3 = transform(p3);

        // 삼각형 그리기
        ctx.beginPath();
        ctx.moveTo(tp1.x, tp1.y);
        ctx.lineTo(tp2.x, tp2.y);
        ctx.lineTo(tp3.x, tp3.y);
        ctx.closePath();

        ctx.fillStyle = 'rgba(76, 175, 80, 0.2)';
        ctx.fill();
        ctx.strokeStyle = '#2E7D32';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 꼭짓점 점 및 이름 표시
        drawVertex(ctx, tp1, 'A');
        drawVertex(ctx, tp2, 'B');
        drawVertex(ctx, tp3, 'C');
    }

    function drawVertex(ctx, p, label) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#d9534f';
        ctx.fill();

        ctx.font = '16px Arial';
        ctx.fillStyle = '#333';
        ctx.fillText(label, p.x - 5, p.y - 10);
    }

    // 초기 화면 그리기
    window.onload = drawTriangle;
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 링크 관리 포털</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 w-full max-w-2xl">
                <i class="fa-solid font-bold text-indigo-600 text-xl fa-link"></i>
                <div class="relative w-full">
                    <input type="text" id="mainTopicInput" 
                           class="w-full text-xl font-bold text-slate-800 bg-transparent border-b-2 border-transparent hover:border-slate-300 focus:border-indigo-600 focus:outline-none px-2 py-1 transition-all"
                           placeholder="주제를 입력하세요 (예: 웹 프로젝트 링크 관리자)"
                           value="내 웹 프로젝트 링크 관리자"
                           onchange="saveMainTopic(this.value)">
                    <span class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none">
                        <i class="fa-solid fa-pen text-slate-300"></i>
                    </span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="resetData()" class="text-xs text-slate-400 hover:text-rose-500 px-3 py-1.5 rounded border border-slate-200 hover:border-rose-200 transition-colors">
                    <i class="fa-solid fa-rotate-right mr-1"></i> 초기화
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 gap-6">

        <!-- Left Sidebar: Dynamic Menu Builder -->
        <aside class="w-80 flex-shrink-0 flex flex-col bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden h-[calc(100vh-7rem)] sticky top-20">
            <!-- Sidebar Header -->
            <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h2 class="font-bold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-list-ul text-indigo-500"></i> 서브메뉴
                </h2>
                <button onclick="openMenuModal(null)" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1.5 rounded-lg font-medium transition-colors flex items-center gap-1 shadow-sm">
                    <i class="fa-solid fa-plus text-xs"></i> 메뉴 추가
                </button>
            </div>

            <!-- Menu List Area -->
            <div class="flex-1 overflow-y-auto p-3 space-y-1" id="menuTree">
                <!-- Dynamically populated -->
            </div>

            <!-- Sidebar Footer Tip -->
            <div class="p-3 bg-slate-50 border-t border-slate-100 text-xs text-slate-500 text-center">
                화살표(▲/▼)나 드래그를 이용해 순서를 쉽게 변경할 수 있습니다.
            </div>
        </aside>

        <!-- Center Main Content Area: HTML Links Management & Drag-Drop Zone -->
        <main class="flex-1 flex flex-col gap-6 overflow-hidden relative">

            <!-- Hidden File Input for File Explorer -->
            <input type="file" id="htmlFileInput" accept=".html,.htm" multiple class="hidden" onchange="handleFileSelect(event)">

            <!-- Drop Zone Wrapper -->
            <div id="dropZone" class="flex-1 bg-white rounded-xl border-2 border-dashed border-slate-200 shadow-sm p-6 overflow-y-auto relative transition-colors duration-200 min-h-[500px] flex flex-col">
                
                <!-- Drag and Drop Overlay Indicator -->
                <div id="dragOverlay" class="absolute inset-0 bg-indigo-50/90 border-2 border-dashed border-indigo-500 rounded-xl flex flex-col items-center justify-center text-indigo-600 font-bold hidden z-30 backdrop-blur-xs pointer-events-none">
                    <i class="fa-solid fa-file-circle-plus text-5xl mb-3 animate-bounce"></i>
                    <p class="text-lg">HTML 파일을 이곳에 드롭하면 등록됩니다!</p>
                    <p class="text-xs text-indigo-400 font-normal mt-1">원하는 만큼 여러 개를 동시에 떨어뜨릴 수 있습니다.</p>
                </div>

                <!-- Always Visible Header inside Main Area when Menu Selected -->
                <div id="mainActionHeader" class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100 hidden">
                    <div class="flex items-center gap-2">
                        <i class="fa-regular fa-folder-open text-indigo-600 text-lg"></i>
                        <span id="contentMenuTitle" class="font-bold text-slate-800 text-lg"></span>
                    </div>
                    <!-- Always Available HTML Import Button -->
                    <button onclick="triggerFileInput()" 
                            class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition-all flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-file-import"></i> HTML 가져오기
                    </button>
                </div>

                <!-- Cards Grid Container -->
                <div id="linksContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
                    <!-- Links will be dynamically populated here -->
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="flex flex-col items-center justify-center py-16 text-center w-full my-auto">
                    <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mb-4 text-2xl">
                        <i class="fa-regular fa-folder-open"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-700 mb-1" id="emptyTitle">등록된 링크가 없습니다</h3>
                    <p class="text-sm text-slate-500 max-w-sm mb-6" id="emptyDesc">
                        HTML 파일을 이곳 중앙으로 <strong>드래그 & 드롭</strong>하거나, 아래의 버튼을 눌러 파일 탐색기에서 링크를 추가해 보세요.
                    </p>
                    <button id="emptyImportBtn" onclick="triggerFileInput()" 
                            class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition-all flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-file-import"></i> HTML 가져오기
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal 1: Add/Edit Menu Modal -->
    <div id="menuModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-100 max-w-md w-full p-6 animate-in fade-in zoom-in-95 duration-150">
            <h3 class="text-lg font-bold text-slate-800 mb-4" id="menuModalTitle">메뉴 추가</h3>
            <form id="menuForm" onsubmit="handleMenuFormSubmit(event)">
                <input type="hidden" id="menuParentId" value="">
                <input type="hidden" id="menuEditId" value="">

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">메뉴 수준</label>
                        <div id="menuTypeBadge" class="text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg inline-block font-medium">
                            1단계 상위 카테고리
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1" for="menuNameInput">메뉴 이름 <span class="text-rose-500">*</span></label>
                        <input type="text" id="menuNameInput" required 
                               class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600"
                               placeholder="예: 프론트엔드 문서, API 가이드">
                    </div>
                </div>

                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeMenuModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">취소</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 2: Edit Link Info Modal -->
    <div id="editLinkModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-100 max-w-md w-full p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4">링크 정보 수정</h3>
            <form id="editLinkForm" onsubmit="handleEditLinkSubmit(event)">
                <input type="hidden" id="editLinkId" value="">
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">제목</label>
                        <input type="text" id="editLinkTitle" required class="w-full text-xs border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">설명</label>
                        <input type="text" id="editLinkDesc" class="w-full text-xs border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-600">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeEditLinkModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">취소</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white text-sm px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">처리되었습니다.</span>
    </div>

    <!-- Script Section -->
    <script>
        const STORAGE_KEY = 'html_link_portal_data';
        const DB_NAME = 'HTMLLinkPortalFileDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'html_files';

        let store = {
            mainTopic: '내 웹 프로젝트 링크 관리자',
            menus: [], 
            links: [], 
            selectedMenuId: null
        };

        let draggedMenuId = null;
        let draggedLinkId = null;
        let db = null;

        // --- IndexedDB Initialization ---
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => {
                    console.error('IndexedDB 오류:', e.target.error);
                    reject(e.target.error);
                };
            });
        }

        function saveFileContentToDB(id, content) {
            return new Promise((resolve, reject) => {
                if (!db) return reject('DB 미연결');
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const storeObj = transaction.objectStore(STORE_NAME);
                const req = storeObj.put({ id: id, content: content });
                req.onsuccess = () => resolve();
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function getFileContentFromDB(id) {
            return new Promise((resolve, reject) => {
                if (!db) return reject('DB 미연결');
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const storeObj = transaction.objectStore(STORE_NAME);
                const req = storeObj.get(id);
                req.onsuccess = () => resolve(req.result ? req.result.content : null);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function deleteFileContentFromDB(id) {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const storeObj = transaction.objectStore(STORE_NAME);
                storeObj.delete(id);
                transaction.oncomplete = () => resolve();
            });
        }

        window.onload = async function() {
            try {
                await initDB();
            } catch (err) {
                console.warn('DB 초기화 실패, 로컬 스토리지 데이터만 사용합니다.', err);
            }
            loadStore();
            renderMainTopic();
            renderMenuTree();
            renderContentArea();
            setupDragAndDrop();
        };

        // --- Data Persistence ---
        function loadStore() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    store = JSON.parse(data);
                } catch (e) {
                    console.error('Failed to parse local storage', e);
                }
            }
        }

        function saveStore() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
        }

        function resetData() {
            if (confirm('모든 메뉴와 링크 데이터가 삭제됩니다. 정말 초기화하시겠습니까?')) {
                localStorage.removeItem(STORAGE_KEY);
                if (db) {
                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    transaction.objectStore(STORE_NAME).clear();
                }
                store = {
                    mainTopic: '내 웹 프로젝트 링크 관리자',
                    menus: [],
                    links: [],
                    selectedMenuId: null
                };
                saveStore();
                renderMainTopic();
                renderMenuTree();
                renderContentArea();
                showToast('모든 데이터가 초기화되었습니다.');
            }
        }

        // --- Header Main Topic ---
        function renderMainTopic() {
            const input = document.getElementById('mainTopicInput');
            if (input) input.value = store.mainTopic || '내 웹 프로젝트 링크 관리자';
        }

        function saveMainTopic(val) {
            store.mainTopic = val.trim() || '내 웹 프로젝트 링크 관리자';
            saveStore();
            showToast('주제가 저장되었습니다.');
        }

        function getMenuDepth(menuId) {
            const menu = store.menus.find(m => m.id === menuId);
            if (!menu || !menu.parentId) return 1;
            const parent = store.menus.find(m => m.id === menu.parentId);
            if (!parent || !parent.parentId) return 2;
            return 3;
        }

        // --- Left Sidebar: Dynamic Menu Builder ---
        function renderMenuTree() {
            const container = document.getElementById('menuTree');
            container.innerHTML = '';

            const topMenus = store.menus.filter(m => !m.parentId);

            if (topMenus.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-400">
                        <i class="fa-solid fa-folder-plus text-2xl mb-2"></i>
                        <p class="text-xs">서브메뉴가 없습니다.<br>상단 '+ 메뉴 추가'를 클릭하세요.</p>
                    </div>
                `;
                return;
            }

            topMenus.forEach((parent, index) => {
                const subMenus = store.menus.filter(m => m.parentId === parent.id);
                const isParentSelected = store.selectedMenuId === parent.id;

                const parentEl = document.createElement('div');
                parentEl.className = 'mb-1';
                parentEl.setAttribute('draggable', 'true');
                parentEl.dataset.menuId = parent.id;

                parentEl.addEventListener('dragstart', (e) => handleMenuDragStart(e, parent.id));
                parentEl.addEventListener('dragover', handleMenuDragOver);
                parentEl.addEventListener('drop', (e) => handleMenuDrop(e, parent.id));
                parentEl.addEventListener('dragend', handleMenuDragEnd);

                const isFirstParent = index === 0;
                const isLastParent = index === topMenus.length - 1;

                parentEl.innerHTML = `
                    <div class="group flex items-center justify-between p-2 rounded-lg text-sm transition-colors cursor-grab active:cursor-grabbing ${isParentSelected ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-700 hover:bg-slate-100'}"
                         onclick="selectMenu('${parent.id}')">
                        <div class="flex items-center gap-1.5 truncate flex-1 min-w-0">
                            <i class="fa-solid fa-grip-vertical text-slate-300 text-xs group-hover:text-slate-400 flex-shrink-0"></i>
                            <i class="fa-regular ${subMenus.length > 0 ? 'fa-folder-open' : 'fa-folder'} text-indigo-500 text-xs flex-shrink-0"></i>
                            <span class="truncate">${escapeHtml(parent.name)}</span>
                        </div>
                        <div class="flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                            <button onclick="event.stopPropagation(); moveMenu('${parent.id}', 'up')" title="위로 이동" class="p-1 text-slate-400 hover:text-indigo-600 rounded ${isFirstParent ? 'opacity-30 cursor-not-allowed' : ''}" ${isFirstParent ? 'disabled' : ''}>
                                <i class="fa-solid fa-arrow-up text-[10px]"></i>
                            </button>
                            <button onclick="event.stopPropagation(); moveMenu('${parent.id}', 'down')" title="아래로 이동" class="p-1 text-slate-400 hover:text-indigo-600 rounded ${isLastParent ? 'opacity-30 cursor-not-allowed' : ''}" ${isLastParent ? 'disabled' : ''}>
                                <i class="fa-solid fa-arrow-down text-[10px]"></i>
                            </button>
                            <button onclick="event.stopPropagation(); openMenuModal('${parent.id}')" title="2단계 서브메뉴 추가" class="p-1 text-slate-400 hover:text-indigo-600 rounded">
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                            <button onclick="event.stopPropagation(); openEditMenuModal('${parent.id}')" title="메뉴 이름 수정" class="p-1 text-slate-400 hover:text-indigo-600 rounded">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="event.stopPropagation(); deleteMenu('${parent.id}')" title="메뉴 삭제" class="p-1 text-slate-400 hover:text-rose-500 rounded">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;

                if (subMenus.length > 0) {
                    const childContainer = document.createElement('div');
                    childContainer.className = 'ml-3 pl-2 border-l border-slate-200 mt-1 space-y-1';

                    subMenus.forEach((child, childIndex) => {
                        const grandSubMenus = store.menus.filter(m => m.parentId === child.id);
                        const isChildSelected = store.selectedMenuId === child.id;
                        const childEl = document.createElement('div');
                        childEl.className = 'mb-1';
                        childEl.setAttribute('draggable', 'true');
                        childEl.dataset.menuId = child.id;

                        childEl.addEventListener('dragstart', (e) => handleMenuDragStart(e, child.id));
                        childEl.addEventListener('dragover', handleMenuDragOver);
                        childEl.addEventListener('drop', (e) => handleMenuDrop(e, child.id));
                        childEl.addEventListener('dragend', handleMenuDragEnd);

                        const isFirstChild = childIndex === 0;
                        const isLastChild = childIndex === subMenus.length - 1;

                        childEl.innerHTML = `
                            <div class="group flex items-center justify-between p-1.5 rounded-md text-xs transition-colors cursor-grab active:cursor-grabbing ${isChildSelected ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-100'}"
                                 onclick="event.stopPropagation(); selectMenu('${child.id}')">
                                <div class="flex items-center gap-1.5 truncate flex-1 min-w-0">
                                    <i class="fa-solid fa-grip-vertical text-slate-300 text-[10px] group-hover:text-slate-400 flex-shrink-0"></i>
                                    <i class="fa-regular fa-file-code text-slate-400 flex-shrink-0"></i>
                                    <span class="truncate">${escapeHtml(child.name)}</span>
                                </div>
                                <div class="flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                                    <button onclick="event.stopPropagation(); moveMenu('${child.id}', 'up')" title="위로 이동" class="p-1 text-slate-400 hover:text-indigo-600 rounded ${isFirstChild ? 'opacity-30 cursor-not-allowed' : ''}" ${isFirstChild ? 'disabled' : ''}>
                                        <i class="fa-solid fa-arrow-up text-[10px]"></i>
                                    </button>
                                    <button onclick="event.stopPropagation(); moveMenu('${child.id}', 'down')" title="아래로 이동" class="p-1 text-slate-400 hover:text-indigo-600 rounded ${isLastChild ? 'opacity-30 cursor-not-allowed' : ''}" ${isLastChild ? 'disabled' : ''}>
                                        <i class="fa-solid fa-arrow-down text-[10px]"></i>
                                    </button>
                                    <button onclick="event.stopPropagation(); openMenuModal('${child.id}')" title="3단계 서브메뉴 추가" class="p-1 text-slate-400 hover:text-indigo-600 rounded">
                                        <i class="fa-solid fa-plus text-xs"></i>
                                    </button>
                                    <button onclick="event.stopPropagation(); openEditMenuModal('${child.id}')" title="메뉴 이름 수정" class="p-1 text-slate-400 hover:text-indigo-600 rounded">
                                        <i class="fa-solid fa-pen text-xs"></i>
                                    </button>
                                    <button onclick="event.stopPropagation(); deleteMenu('${child.id}')" title="메뉴 삭제" class="p-1 text-slate-400 hover:text-rose-500 rounded">
                                        <i class="fa-solid fa-trash text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        `;

                        if (grandSubMenus.length > 0) {
                            const grandChildContainer = document.createElement('div');
                            grandChildContainer.className = 'ml-3 pl-2 border-l border-slate-200 mt-1 space-y-1';

                            grandSubMenus.forEach((grandChild, grandIndex) => {
                                const isGrandSelected = store.selectedMenuId === grandChild.id;
                                const grandEl = document.createElement('div');
                                grandEl.className = `group flex items-center justify-between p-1 rounded text-[11px] transition-colors cursor-grab active:cursor-grabbing ${isGrandSelected ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-500 hover:bg-slate-100'}`;
                                grandEl.setAttribute('draggable', 'true');
                                grandEl.dataset.menuId = grandChild.id;

                                grandEl.addEventListener('dragstart', (e) => handleMenuDragStart(e, grandChild.id));
                                grandEl.addEventListener('dragover', handleMenuDragOver);
                                grandEl.addEventListener('drop', (e) => handleMenuDrop(e, grandChild.id));
                                grandEl.addEventListener('dragend', handleMenuDragEnd);

                                grandEl.onclick = (e) => {
                                    e.stopPropagation();
                                    selectMenu(grandChild.id);
                                };

                                const isFirstGrand = grandIndex === 0;
                                const isLastGrand = grandIndex === grandSubMenus.length - 1;

                                grandEl.innerHTML = `
                                    <div class="flex items-center gap-1.5 truncate flex-1 min-w-0">
                                        <i class="fa-solid fa-grip-vertical text-slate-300 text-[9px] group-hover:text-slate-400 flex-shrink-0"></i>
                                        <i class="fa-regular fa-file-lines text-slate-300 flex-shrink-0"></i>
                                        <span class="truncate">${escapeHtml(grandChild.name)}</span>
                                    </div>
                                    <div class="flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                                        <button onclick="event.stopPropagation(); moveMenu('${grandChild.id}', 'up')" title="위로 이동" class="p-1 text-slate-400 hover:text-indigo-600 rounded ${isFirstGrand ? 'opacity-30 cursor-not-allowed' : ''}" ${isFirstGrand ? 'disabled' : ''}>
                                            <i class="fa-solid fa-arrow-up text-[10px]"></i>
                                        </button>
                                        <button onclick="event.stopPropagation(); moveMenu('${grandChild.id}', 'down')" title="아래로 이동" class="p-1 text-slate-400 hover:text-indigo-600 rounded ${isLastGrand ? 'opacity-30 cursor-not-allowed' : ''}" ${isLastGrand ? 'disabled' : ''}>
                                            <i class="fa-solid fa-arrow-down text-[10px]"></i>
                                        </button>
                                        <button onclick="event.stopPropagation(); openEditMenuModal('${grandChild.id}')" title="메뉴 이름 수정" class="p-1 text-slate-400 hover:text-indigo-600 rounded">
                                            <i class="fa-solid fa-pen text-xs"></i>
                                        </button>
                                        <button onclick="event.stopPropagation(); deleteMenu('${grandChild.id}')" title="메뉴 삭제" class="p-1 text-slate-400 hover:text-rose-500 rounded">
                                            <i class="fa-solid fa-trash text-xs"></i>
                                        </button>
                                    </div>
                                `;
                                grandChildContainer.appendChild(grandEl);
                            });

                            childEl.appendChild(grandChildContainer);
                        }

                        childContainer.appendChild(childEl);
                    });

                    parentEl.appendChild(childContainer);
                }

                container.appendChild(parentEl);
            });
        }

        // --- Menu Up / Down Position Movement ---
        function moveMenu(menuId, direction) {
            const targetMenu = store.menus.find(m => m.id === menuId);
            if (!targetMenu) return;

            const sameLevelMenus = store.menus.filter(m => m.parentId === targetMenu.parentId);
            const currentIndex = sameLevelMenus.findIndex(m => m.id === menuId);

            if (currentIndex === -1) return;

            const newIndex = direction === 'up' ? currentIndex - 1 : currentIndex + 1;

            if (newIndex < 0 || newIndex >= sameLevelMenus.length) return;

            const temp = sameLevelMenus[currentIndex];
            sameLevelMenus[currentIndex] = sameLevelMenus[newIndex];
            sameLevelMenus[newIndex] = temp;

            let newMenuList = [];
            let insertedSameLevel = false;

            store.menus.forEach(m => {
                if (m.parentId === targetMenu.parentId) {
                    if (!insertedSameLevel) {
                        newMenuList.push(...sameLevelMenus);
                        insertedSameLevel = true;
                    }
                } else {
                    newMenuList.push(m);
                }
            });

            store.menus = newMenuList;
            saveStore();
            renderMenuTree();
            showToast('메뉴 위치가 변경되었습니다.');
        }

        // --- Menu Drag and Drop Handlers ---
        function handleMenuDragStart(e, menuId) {
            e.stopPropagation();
            draggedMenuId = menuId;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', menuId);
            setTimeout(() => {
                if (e.target) e.target.classList.add('opacity-40');
            }, 0);
        }

        function handleMenuDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleMenuDrop(e, targetMenuId) {
            e.preventDefault();
            e.stopPropagation();

            if (!draggedMenuId || draggedMenuId === targetMenuId) return;

            const draggedMenu = store.menus.find(m => m.id === draggedMenuId);
            const targetMenu = store.menus.find(m => m.id === targetMenuId);

            if (!draggedMenu || !targetMenu) return;

            if (draggedMenu.parentId !== targetMenu.parentId) {
                showToast('동일한 레벨의 서브메뉴끼리만 순서를 변경할 수 있습니다.');
                return;
            }

            const sameLevelMenus = store.menus.filter(m => m.parentId === draggedMenu.parentId);
            const draggedIndex = sameLevelMenus.findIndex(m => m.id === draggedMenuId);
            const targetIndex = sameLevelMenus.findIndex(m => m.id === targetMenuId);

            if (draggedIndex === -1 || targetIndex === -1) return;

            sameLevelMenus.splice(draggedIndex, 1);
            sameLevelMenus.splice(targetIndex, 0, draggedMenu);

            let newMenuList = [];
            let insertedSameLevel = false;

            store.menus.forEach(m => {
                if (m.parentId === draggedMenu.parentId) {
                    if (!insertedSameLevel) {
                        newMenuList.push(...sameLevelMenus);
                        insertedSameLevel = true;
                    }
                } else {
                    newMenuList.push(m);
                }
            });

            store.menus = newMenuList;
            saveStore();
            renderMenuTree();
            showToast('메뉴 순서가 변경되었습니다.');
        }

        function handleMenuDragEnd(e) {
            e.stopPropagation();
            if (e.target) e.target.classList.remove('opacity-40');
            draggedMenuId = null;
        }

        function selectMenu(id) {
            store.selectedMenuId = id;
            saveStore();
            renderMenuTree();
            renderContentArea();
        }

        // --- Menu Modal Operations ---
        function openMenuModal(parentId = null) {
            document.getElementById('menuParentId').value = parentId || '';
            document.getElementById('menuEditId').value = '';
            document.getElementById('menuNameInput').value = '';

            const badge = document.getElementById('menuTypeBadge');
            if (parentId) {
                const parent = store.menus.find(m => m.id === parentId);
                const parentDepth = getMenuDepth(parentId);
                const nextDepth = parentDepth + 1;

                if (nextDepth > 3) {
                    showToast('서브메뉴는 최대 3단계까지 생성할 수 있습니다.');
                    return;
                }

                badge.innerText = `${nextDepth}단계 서브메뉴 (상위: ${parent ? parent.name : ''})`;
                badge.className = "text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg inline-block font-medium";
            } else {
                badge.innerText = "1단계 상위 카테고리";
                badge.className = "text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg inline-block font-medium";
            }

            const targetDepthText = parentId ? `${getMenuDepth(parentId) + 1}단계 서브메뉴` : '1단계 메뉴';
            document.getElementById('menuModalTitle').innerText = `${targetDepthText} 추가`;
            document.getElementById('menuModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('menuNameInput').focus(), 100);
        }

        function openEditMenuModal(menuId) {
            const menu = store.menus.find(m => m.id === menuId);
            if (!menu) return;

            document.getElementById('menuParentId').value = menu.parentId || '';
            document.getElementById('menuEditId').value = menu.id;
            document.getElementById('menuNameInput').value = menu.name;

            const depth = getMenuDepth(menuId);
            const badge = document.getElementById('menuTypeBadge');
            if (menu.parentId) {
                const parent = store.menus.find(m => m.id === menu.parentId);
                badge.innerText = `${depth}단계 서브메뉴 수정 (상위: ${parent ? parent.name : ''})`;
                badge.className = "text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg inline-block font-medium";
            } else {
                badge.innerText = "1단계 상위 카테고리 수정";
                badge.className = "text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg inline-block font-medium";
            }

            document.getElementById('menuModalTitle').innerText = '메뉴 이름 수정';
            document.getElementById('menuModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('menuNameInput').focus(), 100);
        }

        function closeMenuModal() {
            document.getElementById('menuModal').classList.add('hidden');
        }

        function handleMenuFormSubmit(e) {
            e.preventDefault();
            const parentId = document.getElementById('menuParentId').value || null;
            const editId = document.getElementById('menuEditId').value;
            const name = document.getElementById('menuNameInput').value.trim();

            if (!name) return;

            if (editId) {
                const menu = store.menus.find(m => m.id === editId);
                if (menu) {
                    menu.name = name;
                    showToast('메뉴 이름이 수정되었습니다.');
                }
            } else {
                const newMenu = {
                    id: 'menu_' + Date.now(),
                    name,
                    parentId
                };
                store.menus.push(newMenu);
                store.selectedMenuId = newMenu.id;
                showToast('새 서브메뉴가 생성되었습니다.');
            }

            saveStore();
            closeMenuModal();
            renderMenuTree();
            renderContentArea();
        }

        function getAllDescendantIds(menuId) {
            let ids = [menuId];
            const children = store.menus.filter(m => m.parentId === menuId);
            children.forEach(child => {
                ids = ids.concat(getAllDescendantIds(child.id));
            });
            return ids;
        }

        function deleteMenu(menuId) {
            const menuToDelete = store.menus.find(m => m.id === menuId);
            if (!menuToDelete) return;

            const allTargetIds = getAllDescendantIds(menuId);

            if (confirm(`'${menuToDelete.name}' 메뉴 및 하위 항목/링크를 모두 삭제하시겠습니까?`)) {
                const linksToDelete = store.links.filter(l => allTargetIds.includes(l.menuId));
                linksToDelete.forEach(l => deleteFileContentFromDB(l.id));

                store.menus = store.menus.filter(m => !allTargetIds.includes(m.id));
                store.links = store.links.filter(l => !allTargetIds.includes(l.menuId));

                if (allTargetIds.includes(store.selectedMenuId)) {
                    store.selectedMenuId = null;
                }

                saveStore();
                renderMenuTree();
                renderContentArea();
                showToast('메뉴가 삭제되었습니다.');
            }
        }

        // --- HTML File Import & Permanent Save ---
        function triggerFileInput() {
            if (!store.selectedMenuId) {
                showToast('먼저 좌측에서 링크를 등록할 메뉴를 선택해주세요.');
                return;
            }
            const fileInput = document.getElementById('htmlFileInput');
            fileInput.value = '';
            fileInput.click();
        }

        async function processFiles(files) {
            let addedCount = 0;
            for (const file of files) {
                const fileTitle = file.name.replace(/\.[^/.]+$/, "");
                const linkId = 'link_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);

                try {
                    const textContent = await file.text();
                    await saveFileContentToDB(linkId, textContent);

                    const newLink = {
                        id: linkId,
                        menuId: store.selectedMenuId,
                        title: fileTitle,
                        fileName: file.name,
                        description: `가져오기한 파일 (${file.name})`,
                        createdAt: new Date().toISOString()
                    };

                    store.links.push(newLink);
                    addedCount++;
                } catch (err) {
                    console.error('파일 저장 실패:', err);
                }
            }

            saveStore();
            renderContentArea();
            showToast(`${addedCount}개의 HTML 파일 링크가 가져오기 되었습니다.`);
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            if (!store.selectedMenuId) {
                showToast('먼저 좌측에서 메뉴를 선택해주세요.');
                return;
            }

            processFiles(files);
        }

        // --- Open Saved HTML File ---
        async function openHtmlFile(linkId) {
            try {
                const content = await getFileContentFromDB(linkId);
                if (!content) {
                    showToast('저장된 파일 내용을 찾을 수 없습니다.');
                    return;
                }
                const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
                const blobUrl = URL.createObjectURL(blob);
                window.open(blobUrl, '_blank');
            } catch (e) {
                console.error(e);
                showToast('파일을 여는 중 오류가 발생했습니다.');
            }
        }

        // --- Center Main Content Area & Link Cards Drag & Drop ---
        function renderContentArea() {
            const linksContainer = document.getElementById('linksContainer');
            const emptyState = document.getElementById('emptyState');
            const mainActionHeader = document.getElementById('mainActionHeader');
            const contentMenuTitle = document.getElementById('contentMenuTitle');

            const currentMenu = store.menus.find(m => m.id === store.selectedMenuId);

            if (!currentMenu) {
                linksContainer.innerHTML = '';
                mainActionHeader.classList.add('hidden');
                emptyState.classList.remove('hidden');
                document.getElementById('emptyImportBtn').classList.add('hidden');
                document.getElementById('emptyTitle').innerText = '선택된 메뉴가 없습니다';
                document.getElementById('emptyDesc').innerText = '좌측 메뉴에서 항목을 선택하거나 새로운 서브메뉴를 추가해주세요.';
                return;
            }

            mainActionHeader.classList.remove('hidden');
            contentMenuTitle.innerText = currentMenu.name;

            const menuLinks = store.links.filter(l => l.menuId === currentMenu.id);

            if (menuLinks.length === 0) {
                linksContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                document.getElementById('emptyImportBtn').classList.remove('hidden');
                document.getElementById('emptyTitle').innerText = '등록된 HTML 링크가 없습니다';
                document.getElementById('emptyDesc').innerHTML = `'${escapeHtml(currentMenu.name)}' 메뉴에 HTML 파일을 <strong>드래그 & 드롭</strong>하거나, 버튼을 눌러 추가해 보세요.`;
                return;
            }

            emptyState.classList.add('hidden');
            linksContainer.innerHTML = '';

            menuLinks.forEach((link, idx) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl border border-slate-200 p-4 hover:border-indigo-300 hover:shadow-md transition-all flex flex-col justify-between group h-fit cursor-grab active:cursor-grabbing';
                card.setAttribute('draggable', 'true');
                card.dataset.linkId = link.id;

                // Card Drag and Drop Events
                card.addEventListener('dragstart', (e) => handleLinkCardDragStart(e, link.id));
                card.addEventListener('dragover', handleLinkCardDragOver);
                card.addEventListener('drop', (e) => handleLinkCardDrop(e, link.id));
                card.addEventListener('dragend', handleLinkCardDragEnd);

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <h4 class="font-bold text-slate-800 text-base leading-snug group-hover:text-indigo-600 transition-colors flex items-center gap-1.5">
                                <i class="fa-solid fa-grip-vertical text-slate-300 group-hover:text-slate-400 text-xs"></i>
                                ${escapeHtml(link.title)}
                            </h4>
                            <span class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded font-mono flex-shrink-0 font-semibold">
                                HTML
                            </span>
                        </div>
                        <p class="text-xs text-slate-500 mb-3 break-all font-mono bg-slate-50 p-1.5 rounded border border-slate-100 flex items-center gap-1">
                            <i class="fa-regular fa-file-code text-slate-400"></i>
                            ${escapeHtml(link.fileName || link.title + '.html')}
                        </p>
                        ${link.description ? `<p class="text-xs text-slate-600 mb-4 line-clamp-2">${escapeHtml(link.description)}</p>` : ''}
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t border-slate-100 mt-2 text-xs">
                        <div class="flex gap-1">
                            <button onclick="openEditLinkModal('${link.id}')" class="p-1.5 text-slate-500 hover:text-indigo-600 hover:bg-slate-100 rounded transition-colors" title="수정">
                                <i class="fa-regular fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteLink('${link.id}')" class="p-1.5 text-slate-500 hover:text-rose-600 hover:bg-slate-100 rounded transition-colors" title="삭제">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </div>
                        <button onclick="openHtmlFile('${link.id}')"
                           class="inline-flex items-center gap-1.5 text-xs bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white px-3 py-1.5 rounded-md font-medium transition-colors">
                            <span>열기</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </button>
                    </div>
                `;
                linksContainer.appendChild(card);
            });
        }

        // --- Link Card Drag & Drop Logic ---
        function handleLinkCardDragStart(e, linkId) {
            e.stopPropagation();
            draggedLinkId = linkId;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', linkId);
            setTimeout(() => {
                if (e.target) e.target.classList.add('opacity-40');
            }, 0);
        }

        function handleLinkCardDragOver(e) {
            if (!draggedLinkId) return;
            e.preventDefault();
            e.stopPropagation();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleLinkCardDrop(e, targetLinkId) {
            if (!draggedLinkId) return;
            e.preventDefault();
            e.stopPropagation();

            if (draggedLinkId === targetLinkId) return;

            const draggedIndex = store.links.findIndex(l => l.id === draggedLinkId);
            const targetIndex = store.links.findIndex(l => l.id === targetLinkId);

            if (draggedIndex === -1 || targetIndex === -1) return;

            const [draggedItem] = store.links.splice(draggedIndex, 1);
            store.links.splice(targetIndex, 0, draggedItem);

            saveStore();
            renderContentArea();
            showToast('링크 순서가 변경되었습니다.');
        }

        function handleLinkCardDragEnd(e) {
            e.stopPropagation();
            if (e.target) e.target.classList.remove('opacity-40');
            draggedLinkId = null;
        }

        // --- Drag and Drop Logic for Adding External HTML Files ---
        function setupDragAndDrop() {
            const dropZone = document.getElementById('dropZone');
            const dragOverlay = document.getElementById('dragOverlay');

            let dragCounter = 0;

            window.addEventListener('dragenter', (e) => {
                e.preventDefault();
                if (draggedMenuId || draggedLinkId) return;
                dragCounter++;
                if (store.selectedMenuId) {
                    dragOverlay.classList.remove('hidden');
                }
            });

            window.addEventListener('dragleave', (e) => {
                e.preventDefault();
                if (draggedMenuId || draggedLinkId) return;
                dragCounter--;
                if (dragCounter <= 0) {
                    dragCounter = 0;
                    dragOverlay.classList.add('hidden');
                }
            });

            window.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            window.addEventListener('drop', (e) => {
                if (draggedMenuId || draggedLinkId) return;

                e.preventDefault();
                dragCounter = 0;
                dragOverlay.classList.add('hidden');

                if (!store.selectedMenuId) {
                    showToast('먼저 좌측에서 링크를 등록할 메뉴를 선택해주세요.');
                    return;
                }

                const files = Array.from(e.dataTransfer.files);
                const htmlFiles = files.filter(file => file.name.endsWith('.html') || file.name.endsWith('.htm'));

                if (htmlFiles.length === 0) {
                    showToast('HTML 파일(.html, .htm)만 드롭 가능합니다.');
                    return;
                }

                processFiles(htmlFiles);
            });
        }

        // --- Edit Link Modal ---
        function openEditLinkModal(linkId) {
            const link = store.links.find(l => l.id === linkId);
            if (!link) return;

            document.getElementById('editLinkId').value = link.id;
            document.getElementById('editLinkTitle').value = link.title;
            document.getElementById('editLinkDesc').value = link.description || '';

            document.getElementById('editLinkModal').classList.remove('hidden');
        }

        function closeEditLinkModal() {
            document.getElementById('editLinkModal').classList.add('hidden');
        }

        function handleEditLinkSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('editLinkId').value;
            const link = store.links.find(l => l.id === id);

            if (link) {
                link.title = document.getElementById('editLinkTitle').value.trim();
                link.description = document.getElementById('editLinkDesc').value.trim();
                saveStore();
                renderContentArea();
                showToast('링크 정보가 수정되었습니다.');
            }
            closeEditLinkModal();
        }

        function deleteLink(linkId) {
            if (confirm('이 링크를 삭제하시겠습니까?')) {
                deleteFileContentFromDB(linkId);
                store.links = store.links.filter(l => l.id !== linkId);
                saveStore();
                renderContentArea();
                showToast('링크가 삭제되었습니다.');
            }
        }

        // --- Helper Utilities ---
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>

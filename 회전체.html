<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회전체 시각화 (Solids of Revolution)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrolling */
            font-family: 'Inter', sans-serif;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* Custom Scrollbar for sidebar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen bg-white">

    <!-- 제어 패널 (사이드바) -->
    <aside class="w-full md:w-80 h-auto md:h-full bg-slate-50 border-r border-slate-200 p-6 flex flex-col gap-6 shadow-sm z-10 overflow-y-auto shrink-0">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 mb-2">회전체 시각화</h1>
            <p class="text-sm text-slate-500">평면도형이 회전하여 입체도형이 되는 과정을 관찰해보세요.</p>
        </div>

        <!-- 도형 선택 -->
        <div class="flex flex-col gap-2">
            <label for="shape-select" class="text-sm font-semibold text-slate-700">평면도형 선택</label>
            <select id="shape-select" class="p-2 border border-slate-300 rounded-md bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-sm transition-all">
                <option value="cylinder">직사각형 (원기둥)</option>
                <option value="cone">직각삼각형 (원뿔)</option>
                <option value="sphere">반원 (구)</option>
                <option value="truncated_cone">사다리꼴 (원뿔대)</option>
                <option value="top">다각형 (팽이)</option>
                <option value="vase">곡선 (꽃병)</option>
            </select>
        </div>

        <!-- 애니메이션 제어 버튼 -->
        <div class="flex flex-col gap-3 mt-2">
            <label class="text-sm font-semibold text-slate-700">회전 제어</label>
            <button id="btn-forward" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md shadow-sm transition-colors flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M232,128a104,104,0,0,1-208,0c0-41,23.81-78.36,60.66-95.27a8,8,0,0,1,6.68,14.54C60.15,61.59,40,93.27,40,128a88,88,0,0,0,176,0c0-34.73-20.15-66.41-51.34-80.73a8,8,0,0,1,6.68-14.54C208.19,49.64,232,87,232,128Z"></path><path d="M128,24A104,104,0,0,0,24,128"></path><polygon points="128 24 160 56 128 88 128 24" fill="currentColor"></polygon></svg>
                정방향 회전 (0° ➔ 360°)
            </button>
            <button id="btn-reverse" class="w-full py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-medium rounded-md shadow-sm transition-colors flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M24,128a104,104,0,0,1,208,0c0,41-23.81,78.36-60.66,95.27a8,8,0,0,1-6.68-14.54C195.85,194.41,216,162.73,216,128a88,88,0,0,0-176,0c0,34.73,20.15,66.41,51.34,80.73a8,8,0,0,1-6.68,14.54C47.81,206.36,24,169,24,128Z"></path><path d="M128,232A104,104,0,0,0,232,128"></path><polygon points="128 232 96 200 128 168 128 232" fill="currentColor"></polygon></svg>
                역방향 회전 (360° ➔ 0°)
            </button>
            <button id="btn-reset" class="w-full py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-medium rounded-md shadow-sm transition-colors mt-2">
                초기화 (0°)
            </button>
        </div>

        <!-- 속도 조절 -->
        <div class="flex flex-col gap-2 mt-2">
            <div class="flex justify-between items-center">
                <label for="speed-slider" class="text-sm font-semibold text-slate-700">회전 속도</label>
                <span id="speed-label" class="text-xs text-slate-500 font-mono bg-slate-200 px-2 py-1 rounded">보통</span>
            </div>
            <input type="range" id="speed-slider" min="0.01" max="0.1" step="0.01" value="0.04" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
        </div>

        <div class="mt-auto pt-6">
            <div class="bg-blue-50 border border-blue-100 rounded-lg p-4">
                <p class="text-xs text-blue-800 leading-relaxed">
                    <strong>조작 팁:</strong><br>
                    마우스를 드래그하여 시점을 360도로 돌려볼 수 있습니다. 스크롤하여 확대/축소도 가능합니다.
                </p>
            </div>
        </div>
    </aside>

    <!-- 메인 캔버스 영역 -->
    <main class="flex-1 relative" id="canvas-container">
        <!-- Three.js 캔버스가 삽입될 영역 -->
    </main>

    <!-- Three.js & OrbitControls Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. Three.js 기본 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // 하얀색 바탕화면

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(6, 4, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0);

        // --- 2. 조명 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
        directionalLight.position.set(10, 15, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        scene.add(directionalLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
        backLight.position.set(-10, 10, -10);
        scene.add(backLight);

        // --- 3. 회전축 (y축) 라인 생성 ---
        const axisMaterial = new THREE.LineDashedMaterial({ color: 0x94a3b8, dashSize: 0.2, gapSize: 0.1 });
        const axisGeometry = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 4.5, 0),
            new THREE.Vector3(0, -4.5, 0)
        ]);
        const axisLine = new THREE.Line(axisGeometry, axisMaterial);
        axisLine.computeLineDistances();
        scene.add(axisLine);

        // 회전축 라벨 (단순화된 스프라이트 대신 원점 바닥을 뚫는 그리드 추가)
        const gridHelper = new THREE.GridHelper(10, 10, 0xe2e8f0, 0xf1f5f9);
        gridHelper.position.y = -4;
        scene.add(gridHelper);

        // --- 4. 도형 데이터 정의 ---
        const shapes = {
            cylinder: {
                points: [
                    new THREE.Vector2(0, 3),
                    new THREE.Vector2(2.5, 3),
                    new THREE.Vector2(2.5, -3),
                    new THREE.Vector2(0, -3)
                ],
                color: 0x93c5fd // 파스텔 블루
            },
            cone: {
                points: [
                    new THREE.Vector2(0, 3),
                    new THREE.Vector2(2.5, -3),
                    new THREE.Vector2(0, -3)
                ],
                color: 0xfca5a5 // 파스텔 레드/핑크
            },
            sphere: {
                points: (() => {
                    const pts = [];
                    for (let i = 0; i <= 30; i++) {
                        const angle = Math.PI / 2 - (i / 30) * Math.PI;
                        pts.push(new THREE.Vector2(Math.cos(angle) * 2.5, Math.sin(angle) * 2.5));
                    }
                    return pts;
                })(),
                color: 0xa7f3d0 // 파스텔 그린
            },
            truncated_cone: {
                points: [
                    new THREE.Vector2(0, 2.5),
                    new THREE.Vector2(1.2, 2.5),
                    new THREE.Vector2(2.8, -2.5),
                    new THREE.Vector2(0, -2.5)
                ],
                color: 0xfde047 // 파스텔 옐로우
            },
            top: {
                points: [
                    new THREE.Vector2(0, 3),
                    new THREE.Vector2(1.5, 1.5),
                    new THREE.Vector2(2.5, 0),
                    new THREE.Vector2(0.5, -2.5),
                    new THREE.Vector2(0, -3)
                ],
                color: 0xc4b5fd // 파스텔 퍼플
            },
            vase: {
                points: (() => {
                    const curve = new THREE.SplineCurve([
                        new THREE.Vector2(0, 3),
                        new THREE.Vector2(0.8, 3),
                        new THREE.Vector2(0.4, 1.5),
                        new THREE.Vector2(1.5, -0.5),
                        new THREE.Vector2(2.2, -2),
                        new THREE.Vector2(1.5, -3),
                        new THREE.Vector2(0, -3)
                    ]);
                    return curve.getPoints(40);
                })(),
                color: 0xf9a8d4 // 파스텔 핑크
            }
        };

        // --- 5. 상태 변수 및 객체 관리 ---
        let currentShapeKey = 'cylinder';
        let currentAngle = 0.001; // 완전히 0이면 렌더링되지 않으므로 아주 작은 값 사용
        let targetAngle = 0.001;
        let animationSpeed = 0.04;
        const maxAngle = Math.PI * 2;

        let latheMesh = null;
        let outlineLine = null; // 2D 윤곽선 (항상 표시)

        const materialParams = {
            side: THREE.DoubleSide,
            roughness: 0.3,
            metalness: 0.1,
            flatShading: false,
        };

        // --- 6. 도형 업데이트 함수 ---
        function updateGeometry() {
            const shapeData = shapes[currentShapeKey];
            const points = shapeData.points;
            
            // 기존 메쉬 정리
            if (latheMesh) {
                latheMesh.geometry.dispose();
                scene.remove(latheMesh);
            }
            if (outlineLine) {
                outlineLine.geometry.dispose();
                scene.remove(outlineLine);
            }

            // 1. 회전체 (LatheGeometry) 생성
            // 각도가 매우 작을때는 면이 겹치는 이슈가 있어 최소값 보정
            const renderAngle = Math.max(0.001, currentAngle);
            const latheGeom = new THREE.LatheGeometry(points, 64, 0, renderAngle);
            
            const latheMat = new THREE.MeshStandardMaterial({ 
                color: shapeData.color,
                ...materialParams
            });
            
            latheMesh = new THREE.Mesh(latheGeom, latheMat);
            latheMesh.castShadow = true;
            latheMesh.receiveShadow = true;
            scene.add(latheMesh);

            // 2. 2D 윤곽선 (단면) 생성 - 시각적 이해를 도움
            const outlineGeom = new THREE.BufferGeometry().setFromPoints(points);
            const outlineMat = new THREE.LineBasicMaterial({ 
                color: 0x334155, 
                linewidth: 2, // WebGL 한계로 대부분 1로 렌더링되지만 설정
                depthTest: false // 항상 윤곽선이 뚜렷하게 보이도록
            });
            outlineLine = new THREE.Line(outlineGeom, outlineMat);
            outlineLine.renderOrder = 1; // 늦게 렌더링하여 위로 올라오게
            scene.add(outlineLine);
        }

        // --- 7. 이벤트 리스너 설정 ---
        document.getElementById('shape-select').addEventListener('change', (e) => {
            currentShapeKey = e.target.value;
            currentAngle = 0.001;
            targetAngle = 0.001;
            updateGeometry();
        });

        document.getElementById('btn-forward').addEventListener('click', () => {
            targetAngle = maxAngle;
        });

        document.getElementById('btn-reverse').addEventListener('click', () => {
            targetAngle = 0.001;
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            currentAngle = 0.001;
            targetAngle = 0.001;
            updateGeometry();
        });

        const speedSlider = document.getElementById('speed-slider');
        const speedLabel = document.getElementById('speed-label');
        speedSlider.addEventListener('input', (e) => {
            animationSpeed = parseFloat(e.target.value);
            
            // UI 레이블 업데이트
            if (animationSpeed < 0.03) speedLabel.textContent = "느림";
            else if (animationSpeed > 0.07) speedLabel.textContent = "빠름";
            else speedLabel.textContent = "보통";
        });

        // 반응형 리사이즈 처리
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- 8. 애니메이션 루프 ---
        function animate() {
            requestAnimationFrame(animate);

            // 각도 부드럽게 업데이트
            let needsUpdate = false;
            
            if (Math.abs(currentAngle - targetAngle) > 0.005) {
                if (currentAngle < targetAngle) {
                    currentAngle = Math.min(targetAngle, currentAngle + animationSpeed);
                } else if (currentAngle > targetAngle) {
                    currentAngle = Math.max(targetAngle, currentAngle - animationSpeed);
                }
                needsUpdate = true;
            } else if (currentAngle !== targetAngle) {
                currentAngle = targetAngle; // 스냅
                needsUpdate = true;
            }

            if (needsUpdate) {
                updateGeometry();
            }

            controls.update(); // damping을 위해 필요
            renderer.render(scene, camera);
        }

        // 초기화 및 실행
        window.onload = () => {
            updateGeometry();
            animate();
        };

    </script>
</body>
</html>

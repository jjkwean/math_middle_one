<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회전체 시각화 및 성질 (Solids of Revolution)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrolling */
            font-family: 'Inter', sans-serif;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* Custom Scrollbar for sidebar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen bg-white">

    <!-- 제어 패널 (사이드바) -->
    <aside class="w-full md:w-80 h-auto md:h-full bg-slate-50 border-r border-slate-200 p-6 flex flex-col gap-5 shadow-sm z-10 overflow-y-auto shrink-0">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 mb-1">회전체 시각화</h1>
            <p class="text-xs text-slate-500">평면도형이 회전하여 입체도형이 되는 과정을 관찰해보세요.</p>
        </div>

        <!-- 도형 선택 -->
        <div class="flex flex-col gap-1.5">
            <label for="shape-select" class="text-sm font-semibold text-slate-700">평면도형 선택</label>
            <select id="shape-select" class="p-2 border border-slate-300 rounded-md bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-sm transition-all">
                <option value="cylinder">직사각형 (원기둥)</option>
                <option value="cone">직각삼각형 (원뿔)</option>
                <option value="sphere">반원 (구)</option>
                <option value="truncated_cone">사다리꼴 (원뿔대)</option>
                <option value="top">다각형 (팽이)</option>
                <option value="vase">곡선 (꽃병)</option>
            </select>
        </div>

        <!-- 애니메이션 제어 버튼 -->
        <div class="flex flex-col gap-2 mt-2">
            <label class="text-sm font-semibold text-slate-700">회전 제어</label>
            <div class="flex gap-2">
                <button id="btn-forward" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md shadow-sm transition-colors flex items-center justify-center gap-1">
                    정방향(360°)
                </button>
                <button id="btn-reverse" class="flex-1 py-2 bg-rose-500 hover:bg-rose-600 text-white text-sm font-medium rounded-md shadow-sm transition-colors flex items-center justify-center gap-1">
                    역방향(0°)
                </button>
            </div>
            <button id="btn-reset" class="w-full py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 text-sm font-medium rounded-md shadow-sm transition-colors">
                초기화 (0°)
            </button>
        </div>

        <!-- 성질 관찰 섹션 (새로 추가됨) -->
        <div class="mt-2 border-t border-slate-200 pt-4">
            <h2 class="text-sm font-bold text-indigo-800 mb-3 flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256"><path d="M240,104a16,16,0,0,1-16,16H183.08a40,40,0,0,1,0-48H224A16,16,0,0,1,240,104Zm-80,0a24,24,0,1,0-24-24A24,24,0,0,0,160,104Zm16,40H72.92a40,40,0,0,0,0,48H176a40,40,0,0,0,0-48Zm0,32H96a24,24,0,0,1,0-48h80a24,24,0,0,1,0,48Z"></path></svg>
                회전체의 성질 관찰
            </h2>
            
            <!-- 1. 수직 단면 -->
            <div class="mb-3 bg-white p-3 rounded-md border border-slate-200 shadow-sm">
                <label class="flex items-center gap-2 cursor-pointer mb-1">
                    <input type="checkbox" id="check-horizontal" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-sm font-semibold text-slate-700">1. 회전축에 수직인 단면</span>
                </label>
                <div class="text-xs text-slate-500 mb-3 ml-6 leading-tight">자른 단면의 경계는 <b>원(빨간색 선)</b>입니다.</div>
                <div class="flex items-center gap-2 pl-2">
                    <span class="text-xs text-slate-600 w-8">높이</span>
                    <input type="range" id="horizontal-y-slider" min="-3" max="3" step="0.1" value="0" class="flex-1 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-red-500">
                </div>
            </div>

            <!-- 2. 축 포함 단면 -->
            <div class="bg-white p-3 rounded-md border border-slate-200 shadow-sm">
                <label class="flex items-center gap-2 cursor-pointer mb-1">
                    <input type="checkbox" id="check-vertical" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-sm font-semibold text-slate-700">2. 회전축을 포함하는 단면</span>
                </label>
                <div class="text-xs text-slate-500 mb-3 ml-6 leading-tight">회전축 대칭인 <b>선대칭도형(파란색 선)</b>이며, 어느 방향으로 자르든 <b>합동</b>입니다.</div>
                <div class="flex items-center gap-2 pl-2">
                    <span class="text-xs text-slate-600 w-8">각도</span>
                    <input type="range" id="vertical-angle-slider" min="0" max="360" step="1" value="0" class="flex-1 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                </div>
            </div>
        </div>

        <div class="mt-auto pt-4">
            <div class="bg-blue-50 border border-blue-100 rounded-lg p-3">
                <p class="text-[11px] text-blue-800 leading-relaxed">
                    <strong>조작 팁:</strong> 마우스를 드래그하여 시점을 360도로 돌려보거나, 스크롤하여 확대/축소해보세요.
                </p>
            </div>
        </div>
    </aside>

    <!-- 메인 캔버스 영역 -->
    <main class="flex-1 relative" id="canvas-container">
        <!-- Three.js 캔버스가 삽입될 영역 -->
    </main>

    <!-- Three.js & OrbitControls Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. Three.js 기본 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(6, 4, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0);

        // --- 2. 조명 설정 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
        directionalLight.position.set(10, 15, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
        backLight.position.set(-10, 10, -10);
        scene.add(backLight);

        // --- 3. 회전축 (y축) 및 그리드 ---
        const axisMaterial = new THREE.LineDashedMaterial({ color: 0x94a3b8, dashSize: 0.2, gapSize: 0.1 });
        const axisGeometry = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 4.5, 0),
            new THREE.Vector3(0, -4.5, 0)
        ]);
        const axisLine = new THREE.Line(axisGeometry, axisMaterial);
        axisLine.computeLineDistances();
        scene.add(axisLine);

        const gridHelper = new THREE.GridHelper(10, 10, 0xe2e8f0, 0xf1f5f9);
        gridHelper.position.y = -4;
        scene.add(gridHelper);

        // --- 4. 도형 데이터 정의 ---
        const shapes = {
            cylinder: {
                points: [
                    new THREE.Vector2(0, 3), new THREE.Vector2(2.5, 3), 
                    new THREE.Vector2(2.5, -3), new THREE.Vector2(0, -3)
                ],
                color: 0x93c5fd
            },
            cone: {
                points: [
                    new THREE.Vector2(0, 3), new THREE.Vector2(2.5, -3), new THREE.Vector2(0, -3)
                ],
                color: 0xfca5a5
            },
            sphere: {
                points: (() => {
                    const pts = [];
                    for (let i = 0; i <= 30; i++) {
                        const angle = Math.PI / 2 - (i / 30) * Math.PI;
                        pts.push(new THREE.Vector2(Math.cos(angle) * 2.5, Math.sin(angle) * 2.5));
                    }
                    return pts;
                })(),
                color: 0xa7f3d0
            },
            truncated_cone: {
                points: [
                    new THREE.Vector2(0, 2.5), new THREE.Vector2(1.2, 2.5), 
                    new THREE.Vector2(2.8, -2.5), new THREE.Vector2(0, -2.5)
                ],
                color: 0xfde047
            },
            top: {
                points: [
                    new THREE.Vector2(0, 3), new THREE.Vector2(1.5, 1.5), 
                    new THREE.Vector2(2.5, 0), new THREE.Vector2(0.5, -2.5), 
                    new THREE.Vector2(0, -3)
                ],
                color: 0xc4b5fd
            },
            vase: {
                points: (() => {
                    const curve = new THREE.SplineCurve([
                        new THREE.Vector2(0, 3), new THREE.Vector2(0.8, 3), 
                        new THREE.Vector2(0.4, 1.5), new THREE.Vector2(1.5, -0.5), 
                        new THREE.Vector2(2.2, -2), new THREE.Vector2(1.5, -3), 
                        new THREE.Vector2(0, -3)
                    ]);
                    return curve.getPoints(40);
                })(),
                color: 0xf9a8d4
            }
        };

        // --- 5. 상태 변수 ---
        let currentShapeKey = 'cylinder';
        let currentAngle = 0.001;
        let targetAngle = 0.001;
        let animationSpeed = 0.04;
        const maxAngle = Math.PI * 2;

        let latheMesh = null;
        let outlineLine = null;

        const materialParams = {
            side: THREE.DoubleSide,
            roughness: 0.3,
            metalness: 0.1,
            flatShading: false,
        };

        // --- 6. 성질 시각화용 3D 객체 준비 ---
        // 1) 수직 평면 (성질 1)
        const horizontalPlaneGeom = new THREE.PlaneGeometry(8, 8);
        const horizontalPlaneMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
        const horizontalPlane = new THREE.Mesh(horizontalPlaneGeom, horizontalPlaneMat);
        horizontalPlane.rotation.x = -Math.PI / 2;
        horizontalPlane.visible = false;
        scene.add(horizontalPlane);

        const horizontalCircleMat = new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 3, depthTest: false }); // Red, 항상 위에 표시
        let horizontalCircleLine = new THREE.LineLoop(new THREE.BufferGeometry(), horizontalCircleMat);
        horizontalCircleLine.visible = false;
        horizontalCircleLine.renderOrder = 999;
        scene.add(horizontalCircleLine);

        // 2) 축 포함 단면 (성질 2)
        const verticalPlaneGeom = new THREE.PlaneGeometry(8, 8);
        const verticalPlaneMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
        const verticalPlane = new THREE.Mesh(verticalPlaneGeom, verticalPlaneMat);
        
        const verticalOutlineMat = new THREE.LineBasicMaterial({ color: 0x2563eb, linewidth: 3, depthTest: false }); // Blue, 항상 위에 표시
        let verticalOutlineLine = new THREE.Line(new THREE.BufferGeometry(), verticalOutlineMat);
        verticalOutlineLine.renderOrder = 999;
        
        const verticalGroup = new THREE.Group();
        verticalGroup.add(verticalPlane);
        verticalGroup.add(verticalOutlineLine);
        verticalGroup.visible = false;
        scene.add(verticalGroup);

        // --- 7. 유틸 및 렌더링 업데이트 함수 ---
        // 특정 Y 높이에서의 회전체 반지름을 선형 보간으로 구하는 함수
        function getRadiusAtY(points, y) {
            let r = 0;
            for (let i = 0; i < points.length - 1; i++) {
                let p1 = points[i];
                let p2 = points[i+1];
                if ((p1.y >= y && p2.y <= y) || (p1.y <= y && p2.y >= y)) {
                    if (p1.y === p2.y) {
                        r = Math.max(r, Math.max(p1.x, p2.x));
                    } else {
                        let t = (y - p1.y) / (p2.y - p1.y);
                        let x = p1.x + t * (p2.x - p1.x);
                        r = Math.max(r, x);
                    }
                }
            }
            return r;
        }

        function updateHorizontalSection() {
            const isVisible = document.getElementById('check-horizontal').checked;
            horizontalPlane.visible = isVisible;
            horizontalCircleLine.visible = isVisible;

            if (isVisible) {
                const yPos = parseFloat(document.getElementById('horizontal-y-slider').value);
                horizontalPlane.position.y = yPos;
                
                const shapeData = shapes[currentShapeKey];
                const radius = getRadiusAtY(shapeData.points, yPos);
                
                const circlePoints = [];
                if (radius > 0.01) {
                    const segments = 64;
                    for (let i = 0; i <= segments; i++) {
                        const theta = (i / segments) * Math.PI * 2;
                        circlePoints.push(new THREE.Vector3(Math.cos(theta) * radius, yPos, Math.sin(theta) * radius));
                    }
                }
                horizontalCircleLine.geometry.dispose();
                horizontalCircleLine.geometry = new THREE.BufferGeometry().setFromPoints(circlePoints);
            }
            updateMeshTransparency();
        }

        function updateVerticalSection() {
            const isVisible = document.getElementById('check-vertical').checked;
            verticalGroup.visible = isVisible;

            if (isVisible) {
                const angleDeg = parseFloat(document.getElementById('vertical-angle-slider').value);
                verticalGroup.rotation.y = THREE.MathUtils.degToRad(angleDeg);

                const shapeData = shapes[currentShapeKey];
                const outlinePts = [];
                // 오른쪽 (원래 도형)
                for (let i = 0; i < shapeData.points.length; i++) {
                    outlinePts.push(new THREE.Vector3(shapeData.points[i].x, shapeData.points[i].y, 0));
                }
                // 왼쪽 (선대칭 복사)
                for (let i = shapeData.points.length - 1; i >= 0; i--) {
                    outlinePts.push(new THREE.Vector3(-shapeData.points[i].x, shapeData.points[i].y, 0));
                }
                if (outlinePts.length > 0 && !outlinePts[0].equals(outlinePts[outlinePts.length-1])) {
                     outlinePts.push(outlinePts[0].clone()); // 폐곡선 닫기
                }

                verticalOutlineLine.geometry.dispose();
                verticalOutlineLine.geometry = new THREE.BufferGeometry().setFromPoints(outlinePts);
            }
            updateMeshTransparency();
        }

        // 단면을 쉽게 관찰하도록 회전체를 반투명하게 만듦
        function updateMeshTransparency() {
            if (!latheMesh) return;
            const hChecked = document.getElementById('check-horizontal').checked;
            const vChecked = document.getElementById('check-vertical').checked;
            
            if (hChecked || vChecked) {
                latheMesh.material.transparent = true;
                latheMesh.material.opacity = 0.65;
            } else {
                latheMesh.material.transparent = false;
                latheMesh.material.opacity = 1.0;
            }
        }

        // 전체 도형 지오메트리 갱신
        function updateGeometry() {
            const shapeData = shapes[currentShapeKey];
            const points = shapeData.points;
            
            if (latheMesh) {
                latheMesh.geometry.dispose();
                scene.remove(latheMesh);
            }
            if (outlineLine) {
                outlineLine.geometry.dispose();
                scene.remove(outlineLine);
            }

            const renderAngle = Math.max(0.001, currentAngle);
            const latheGeom = new THREE.LatheGeometry(points, 64, 0, renderAngle);
            
            const latheMat = new THREE.MeshStandardMaterial({ 
                color: shapeData.color,
                ...materialParams
            });
            
            latheMesh = new THREE.Mesh(latheGeom, latheMat);
            latheMesh.castShadow = true;
            latheMesh.receiveShadow = true;
            scene.add(latheMesh);

            const outlineGeom = new THREE.BufferGeometry().setFromPoints(points);
            const outlineMat = new THREE.LineBasicMaterial({ 
                color: 0x334155, 
                depthTest: false 
            });
            outlineLine = new THREE.Line(outlineGeom, outlineMat);
            outlineLine.renderOrder = 1;
            scene.add(outlineLine);

            // 단면 뷰 업데이트 반영
            updateHorizontalSection();
            updateVerticalSection();
        }

        // --- 8. 이벤트 리스너 설정 ---
        document.getElementById('shape-select').addEventListener('change', (e) => {
            currentShapeKey = e.target.value;
            currentAngle = 0.001;
            targetAngle = 0.001;
            updateGeometry();
        });

        document.getElementById('btn-forward').addEventListener('click', () => { targetAngle = maxAngle; });
        document.getElementById('btn-reverse').addEventListener('click', () => { targetAngle = 0.001; });
        document.getElementById('btn-reset').addEventListener('click', () => {
            currentAngle = 0.001; targetAngle = 0.001; updateGeometry();
        });

        // 성질 관찰 이벤트
        document.getElementById('check-horizontal').addEventListener('change', updateHorizontalSection);
        document.getElementById('horizontal-y-slider').addEventListener('input', updateHorizontalSection);
        
        document.getElementById('check-vertical').addEventListener('change', updateVerticalSection);
        document.getElementById('vertical-angle-slider').addEventListener('input', updateVerticalSection);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- 9. 애니메이션 루프 ---
        function animate() {
            requestAnimationFrame(animate);

            let needsUpdate = false;
            if (Math.abs(currentAngle - targetAngle) > 0.005) {
                if (currentAngle < targetAngle) currentAngle = Math.min(targetAngle, currentAngle + animationSpeed);
                else if (currentAngle > targetAngle) currentAngle = Math.max(targetAngle, currentAngle - animationSpeed);
                needsUpdate = true;
            } else if (currentAngle !== targetAngle) {
                currentAngle = targetAngle;
                needsUpdate = true;
            }

            if (needsUpdate) {
                updateGeometry();
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = () => {
            updateGeometry();
            animate();
        };

    </script>
</body>
</html>
